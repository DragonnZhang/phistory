name: Capture prompts

on:
  workflow_dispatch:
  schedule:
    - cron: "37 2 * * *"

permissions:
  contents: write

concurrency:
  group: capture-prompts-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GH_TOKEN: ${{ github.token }}
  CAPTURE_AGENTS: claude-code,codex,dsh,antigravity,grok,minimax-code,kimi-code,qwen-code,mimo,openclaw,hermes,kimi,opencode,pi,omp

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv sync --all-groups
      - run: uv run ruff format --check phistory tests
      - run: uv run ruff check phistory tests
      - run: uv run pytest
      - run: uv build
      - name: Capture latest prompts
        id: latest
        run: |
          set +e
          uv run phistory capture --latest --agents "$CAPTURE_AGENTS" --summary-title "Latest capture"
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Capture latest Qoder prompt
        id: qoder
        env:
          QODER_PERSONAL_ACCESS_TOKEN: ${{ secrets.QODER_PERSONAL_ACCESS_TOKEN }}
        run: |
          set +e
          uv run phistory capture --latest --agents qoder --summary-title "Latest Qoder capture"
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Verify Qoder secret is not archived
        env:
          QODER_PERSONAL_ACCESS_TOKEN: ${{ secrets.QODER_PERSONAL_ACCESS_TOKEN }}
        run: |
          if [ -z "${QODER_PERSONAL_ACCESS_TOKEN:-}" ]; then
            exit 0
          fi
          if [ ! -d captures/qoder ]; then
            exit 0
          fi
          if rg --files-with-matches --fixed-strings -- "$QODER_PERSONAL_ACCESS_TOKEN" captures/qoder; then
            echo "::error title=Qoder credential leak detected::Refusing to render or commit capture artifacts."
            exit 1
          fi
      - name: Extract Claude Code static prompts
        id: static
        run: |
          set +e
          uv run phistory extract-static claude-code --latest-captured 10
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - run: uv run phistory render-index
      - run: uv run phistory render-site
      - name: Commit capture updates
        run: |
          git add README.md README_zh.md index.html docs captures
          if git diff --cached --quiet; then
            echo "No capture changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Capture latest prompt snapshots"
          git push
      - name: Smoke capture
        if: github.event_name == 'workflow_dispatch'
        run: uv run phistory --root /tmp/phistory-smoke --cache-dir /tmp/phistory-smoke-cache capture --latest --agents "$CAPTURE_AGENTS" --force --summary-title "Smoke capture"
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch' && always()
        with:
          name: smoke-captures
          path: /tmp/phistory-smoke
          retention-days: 7
      - name: Report capture failures
        if: always() && (steps.latest.outputs.status != '0' || steps.qoder.outputs.status != '0' || steps.static.outputs.status != '0')
        run: |
          echo "::error title=Some prompt archive steps failed::Successful artifacts were still committed and will be deployed. Check the capture and static extraction logs for details."
          echo "One or more capture or static extraction steps failed. Successful artifacts were committed and the Pages workflow will still deploy them."
          exit 1
