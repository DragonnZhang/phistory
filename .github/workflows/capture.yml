name: Capture prompts

on:
  workflow_dispatch:
  schedule:
    - cron: "37 2 * * *"

permissions:
  contents: write

concurrency:
  group: capture-prompts-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GH_TOKEN: ${{ github.token }}
  # Legacy kimi ended at 1.51.0; 1.52.0 only prints a migration notice (kimi-cli#2666).
  CAPTURE_AGENTS: claude-code,codex,dsh,antigravity,grok,minimax-code,kimi-code,qwen-code,mimo,openclaw,hermes,opencode,pi,omp,gemini-cli,goose,crush,mini-swe-agent,nanobot,bub,jcode,pi-rust,codewhale,opendev,kilocode,cline,letta-code,prime-agent,openinterpreter,fibona-agent,ctxagent,deepseek-reasonix,quorum-cli,tianshu-harness,octomind,headlong,openagent,nausicaa-harness,cheetahclaws,trashclaw,mini-agi,openmanus,cuga-agent,autoresearchclaw,inkos,db-gpt,ufo,longhorizon-harness,markus,wechat-mac-rpa,autoref,agent-s,critic-training,empryo,web3gpt,atomic-agent,hive,intentkit,mirix,ouroboros,zcode,agent-zero,raven,gpt-researcher,openevolve,deer-flow,omni-rewriter,agenticseek,nanomuse,pr-agent,deepanalyze,localgpt,bambooai,cowagent

jobs:
  capture:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.1-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: phistory-local-db
          POSTGRES_DB: phistory
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8.4-bookworm
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          check-latest: true
      - uses: astral-sh/setup-uv@v8.1.0
      - uses: ./.github/actions/setup-agent-runtimes
        with:
          agents: ${{ env.CAPTURE_AGENTS }}
      - run: uv sync --all-groups
      - run: uv run ruff format --check phistory tests
      - run: uv run ruff check phistory tests
      - run: uv run pytest
      - run: uv build
      - name: Capture latest prompts
        id: latest
        run: |
          set +e
          uv run phistory capture --latest --agents "$CAPTURE_AGENTS" --summary-title "Latest capture"
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Capture latest Qoder prompt
        id: qoder
        env:
          QODER_PERSONAL_ACCESS_TOKEN: ${{ secrets.QODER_PERSONAL_ACCESS_TOKEN }}
        run: |
          set +e
          uv run phistory capture --latest --agents qoder --summary-title "Latest Qoder capture"
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Verify Qoder secret is not archived
        env:
          QODER_PERSONAL_ACCESS_TOKEN: ${{ secrets.QODER_PERSONAL_ACCESS_TOKEN }}
        run: bash .github/scripts/verify-qoder-secret.sh
      - name: Extract Claude Code static prompts
        id: static
        run: |
          set +e
          uv run phistory extract-static claude-code --latest-captured 10
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - run: uv run phistory render-index
      - run: uv run phistory render-site
      - run: uv run phistory render-sources
      - name: Commit capture updates
        run: |
          git add README.md README_zh.md index.html sources.html docs captures source-captures/index.json
          if git diff --cached --quiet; then
            echo "No capture changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Capture latest prompt snapshots"
          git push
      - name: Smoke capture
        if: github.event_name == 'workflow_dispatch'
        run: uv run phistory --root /tmp/phistory-smoke --cache-dir /tmp/phistory-smoke-cache capture --latest --agents "$CAPTURE_AGENTS" --force --summary-title "Smoke capture"
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch' && always()
        with:
          name: smoke-captures
          path: /tmp/phistory-smoke
          retention-days: 7
      - name: Report capture failures
        if: always() && (steps.latest.outputs.status != '0' || steps.qoder.outputs.status != '0' || steps.static.outputs.status != '0')
        run: |
          echo "::error title=Some prompt archive steps failed::Successful artifacts were still committed and will be deployed. Check the capture and static extraction logs for details."
          echo "One or more capture or static extraction steps failed. Successful artifacts were committed and the Pages workflow will still deploy them."
          exit 1
